# One namespace per organisation, plain Kubernetes (no Capsule).
# Adding an org: copy one org block, change the name, label (and ideally taint)
# its nodes coder.demo/org-<org>=true, add it to the template's
# `organisations` variable.

# Minimal rights the Coder provisioner needs to manage workspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-workspace-provisioner
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, secrets, services, configmaps]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [create, delete, deletecollection, get, list, patch, update, watch]

# ----------------------------------------------------------------- acme
---
apiVersion: v1
kind: Namespace
metadata:
  name: acme-workspaces
  labels:
    coder.demo/org: acme
    coder.demo/org-isolation: enabled
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: coder-provisioner, namespace: acme-workspaces}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: coder-workspace-provisioner}
subjects: [{kind: ServiceAccount, name: coder, namespace: coder}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: org-isolation, namespace: acme-workspaces}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {coder.demo/org: acme}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: org-quota, namespace: acme-workspaces}
spec:
  hard: {limits.cpu: "8", limits.memory: 16Gi, persistentvolumeclaims: "20"}

