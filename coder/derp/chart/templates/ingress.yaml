{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- range .Values.nodes }}
{{- $ctx := dict "root" $root "node" . }}
{{- with $root }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "derper.nodeFullname" $ctx }}
  labels:
    {{- include "derper.nodeLabels" $ctx | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $ctx.node.hostname | quote }}]
      secretName: {{ include "derper.nodeIngressTLSSecret" $ctx }}
  {{- end }}
  rules:
    - host: {{ $ctx.node.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "derper.nodeFullname" $ctx }}
                port:
                  name: derp
{{- end }}
{{- end }}
{{- end }}
