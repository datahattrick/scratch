{{- $root := . }}
{{- range .Values.nodes }}
{{- $ctx := dict "root" $root "node" . }}
{{- $node := . }}
{{- with $root }}
---
{{- if .Values.ingress.enabled }}
# Ingress backend for node {{ $node.name }}.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "derper.nodeFullname" $ctx }}
  labels:
    {{- include "derper.nodeLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "derper.nodeSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: derp
      port: 80
      targetPort: derp
      protocol: TCP
{{- else }}
# Relay and STUN for node {{ $node.name }}.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "derper.nodeFullname" $ctx }}
  labels:
    {{- include "derper.nodeLabels" $ctx | nindent 4 }}
  {{- with (merge (dict) (default (dict) $node.serviceAnnotations) .Values.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- with $node.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "derper.nodeSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: derp
      port: {{ .Values.service.derpPort }}
      targetPort: derp
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") (dig "nodePorts" "derp" "" $node) }}
      nodePort: {{ $node.nodePorts.derp }}
      {{- end }}
    {{- if .Values.stun.enabled }}
    - name: stun
      port: {{ .Values.service.stunPort }}
      targetPort: stun
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") (dig "nodePorts" "stun" "" $node) }}
      nodePort: {{ $node.nodePorts.stun }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.stun.enabled }}
---
# STUN for all nodes in Ingress mode. STUN is stateless, so any pod can answer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "derper.fullname" . }}-stun
  labels:
    {{- include "derper.labels" . | nindent 4 }}
  {{- with .Values.stunService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.stunService.type }}
  {{- if ne .Values.stunService.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.stunService.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.stunService.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.stunService.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.stunService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "derper.selectorLabels" . | nindent 4 }}
  ports:
    - name: stun
      port: {{ .Values.stunService.port }}
      targetPort: stun
      protocol: UDP
      {{- if and (eq .Values.stunService.type "NodePort") .Values.stunService.nodePort }}
      nodePort: {{ .Values.stunService.nodePort }}
      {{- end }}
{{- end }}
