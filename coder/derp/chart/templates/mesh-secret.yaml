{{- if and (include "derper.meshEnabled" .) (not .Values.mesh.existingSecret) }}
{{- $name := include "derper.meshSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $psk := "" }}
{{- if and $existing (index $existing.data .Values.mesh.secretKey) }}
{{- $psk = index $existing.data .Values.mesh.secretKey | b64dec }}
{{- else }}
{{- $psk = randAlphaNum 64 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "derper.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.mesh.secretKey }}: {{ $psk | b64enc }}
{{- end }}
